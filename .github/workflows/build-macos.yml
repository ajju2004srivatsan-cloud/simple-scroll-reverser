name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun swift --version
          sudo xcode-select -p

      - name: Build and zip
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleScrollReverser
          path: dist/SimpleScrollReverser.zip
          if-no-files-found: error

      - name: Publish GitHub Release (version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimpleScrollReverser.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Ready-to-run build of **Simple Scroll Reverser**.

            1. Download `SimpleScrollReverser.zip`, unzip it, and move `Simple Scroll Reverser.app` to `/Applications`.
            2. If macOS shows **“Simple Scroll Reverser” Not Opened** (Apple could not verify it is free of malware): that is Gatekeeper, *before* the app launches. Open **System Settings → Privacy & Security**, scroll to **Security**, click **Open Anyway**. Or Control-click the app → Open → Open.
            3. Terminal fallback: `xattr -cr "/Applications/Simple Scroll Reverser.app"`
            4. This zip is ad-hoc signed, not Developer ID notarized — the app cannot bypass that first dialog.
            5. After it opens, use the Setup Guide to grant **Accessibility** (required) and **Input Monitoring** (recommended).

      - name: Publish latest pre-release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: dist/SimpleScrollReverser.zip
          fail_on_unmatched_files: true
          body: |
            Rolling build from `main` (updated on each merge).

            Prefer a numbered tag (`v1.0.0`) release when one exists: https://github.com/${{ github.repository }}/releases/latest

            1. Download `SimpleScrollReverser.zip`, unzip, move `Simple Scroll Reverser.app` to `/Applications`.
            2. **If Mac says Not Opened:** System Settings → Privacy & Security → Security → **Open Anyway**, or Control-click → Open → Open. Fallback: `xattr -cr "/Applications/Simple Scroll Reverser.app"`
            3. Ad-hoc signed, not notarized — Gatekeeper runs before the app starts; nothing in the app bypasses it.
            4. Then use the in-app Setup Guide for Accessibility and Input Monitoring.
